server {
    listen 8080;
    server_name _;

    client_max_body_size 50m;

    location /assets/ {
        root /srv/frappe-sites;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Each Press site keeps uploaded images under its own public/files tree.
    # The Host header selects the tenant directory while preserving /files/.
    location /files/ {
        root /srv/frappe-sites/$host/public;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /socket.io/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_pass http://bench-0001-000007-dukkanip:9000;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name $host;
        proxy_read_timeout 120s;
        proxy_pass http://bench-0001-000007-dukkanip:8000;
    }
}
