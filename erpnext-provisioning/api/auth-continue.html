<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>جاري توجيهك — دكاني</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f5fb;color:#24123f;font-family:"Segoe UI",Tahoma,Arial,sans-serif}.card{width:min(92%,460px);padding:36px;text-align:center;background:#fff;border:1px solid #e8e1f0;border-radius:18px;box-shadow:0 12px 35px #32105f12}.spin{width:38px;height:38px;margin:0 auto 20px;border:4px solid #eadffd;border-top-color:#7c3aed;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{font-size:23px;margin:0 0 10px}p{margin:0;color:#6b6274;line-height:1.8}.err{color:#b42318}a{color:#7c3aed;font-weight:700}
</style>
</head>
<body><main class="card"><div class="spin" id="spin"></div><h1>جاري تجهيز حسابك</h1><p id="message">نتأكد من المتجر المرتبط ببريدك…</p></main>
<script>
(async function(){
  const message=document.getElementById("message");
  try{
    const userResponse=await fetch("/api/method/frappe.auth.get_logged_user",{credentials:"same-origin"});
    if(!userResponse.ok) throw new Error("not_logged_in");
    const payload=await userResponse.json();
    const email=(payload.message||"").trim().toLowerCase();
    if(!email||email==="guest") throw new Error("not_logged_in");
    const resolved=await fetch("/resolve?email="+encodeURIComponent(email),{credentials:"same-origin"});
    if(resolved.ok){
      const data=await resolved.json();
      if(data.subdomain){
        message.textContent="تم العثور على متجرك، جاري تحويلك…";
        location.replace("https://"+data.subdomain+".dukani.ai/merchant-login");
        return;
      }
    }
    message.textContent="حساب جديد، جاري تحويلك لإنشاء متجرك…";
    location.replace("/signup?email="+encodeURIComponent(email));
  }catch(error){
    document.getElementById("spin").style.display="none";
    message.className="err";
    message.innerHTML='تعذر إكمال تسجيل الدخول. <a href="/login?redirect-to=/auth-continue">حاولي مرة أخرى</a>';
  }
})();
</script></body></html>
