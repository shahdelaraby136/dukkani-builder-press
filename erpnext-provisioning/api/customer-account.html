<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حسابي</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f6f8;color:#252525;font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;display:grid;place-items:center;padding:28px}.wrap{width:min(810px,100%)}.card{background:#fff;border:1px solid #d8d8d8;border-radius:18px;padding:45px 60px 58px;box-shadow:0 2px 8px #0002}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}h1{margin:0;font-size:25px;direction:ltr}.person{display:flex;align-items:center;gap:17px;color:#555}.avatar{width:44px;height:44px;border-radius:50%;background:#f0f0f0;color:#9b9b9b;display:grid;place-items:center;font-size:18px}.list{border:1px solid #ddd;border-radius:13px;overflow:hidden}.row{width:100%;height:63px;border:0;border-bottom:1px solid #e5e5e5;background:#fff;display:flex;align-items:center;gap:16px;padding:0 20px;color:#777;font:500 18px inherit;text-align:right;cursor:pointer}.row:last-child{border-bottom:0}.icon{width:28px;text-align:center;font-size:25px;color:#888}.nav{display:flex;justify-content:center;gap:44px;margin-top:62px;color:#777}.nav a,.nav button{border:0;background:none;color:#777;text-decoration:none;font:500 18px inherit;cursor:pointer;display:flex;align-items:center;gap:9px}.msg{display:none;margin-top:14px;padding:11px;border-radius:9px;background:#f3f4f6;color:#555}@media(max-width:600px){.card{padding:28px 20px}.row{font-size:15px}.nav{gap:18px;flex-wrap:wrap;margin-top:35px}}
</style></head><body><main class="wrap"><section class="card"><div class="top"><h1>حسابي</h1><div class="person"><span id="customer-name">العميل</span><span class="avatar" id="avatar">ع</span></div></div><div class="list"><div class="row"><span class="icon">◎</span><span id="customer-email">البريد الإلكتروني</span></div></div></section><nav class="nav"><a href="/">⌂ الرئيسية</a><a href="/customer-orders">▦ طلباتي</a><button id="logout">⇥ خروج</button></nav></main><script>
const store=location.hostname.split('.')[0],key=`dukkani-customer-v2-${store}`;localStorage.removeItem(`dukkani-customer-${store}`);let customer=null;try{customer=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}if(!customer||!customer.loggedIn||!customer.email){location.replace('/customer-login')}else{const name=customer.name||customer.email;document.getElementById('customer-name').textContent=name;document.getElementById('customer-email').textContent=customer.email;document.getElementById('avatar').textContent=name.trim().charAt(0)||'ع'}document.getElementById('logout').onclick=()=>{localStorage.removeItem(key);location.replace('/')};
</script></body></html>
