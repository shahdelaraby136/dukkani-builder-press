<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلباتي</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#222;font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}.head{height:74px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center}.head-inner{width:min(900px,calc(100% - 32px));margin:auto;display:flex;justify-content:space-between;align-items:center}.head a{color:#7c3aed;text-decoration:none;font-weight:800}.main{width:min(900px,calc(100% - 32px));margin:44px auto}.title{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}h1{margin:0;font-size:32px}.email{color:#6b7280;direction:ltr}.orders{display:grid;gap:14px}.order{background:#fff;border:1px solid #ddd;border-radius:14px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:12px}.order-name{font-weight:900;font-size:18px;direction:ltr;text-align:right}.meta{color:#6b7280;margin-top:7px}.status{align-self:center;padding:8px 13px;border-radius:99px;background:#f1edff;color:#6d28d9;font-weight:800}.empty,.loading,.error{background:#fff;border:1px solid #ddd;border-radius:14px;padding:48px;text-align:center;color:#6b7280}.error{color:#b91c1c}@media(max-width:600px){.title{display:block}.email{margin-top:8px}.order{grid-template-columns:1fr}.status{justify-self:start}}
</style></head><body><header class="head"><div class="head-inner"><strong>طلباتي</strong><a href="/me">حسابي ←</a></div></header><main class="main"><div class="title"><h1>طلباتك</h1><div class="email" id="email"></div></div><div class="orders" id="orders"><div class="loading">جاري تحميل الطلبات…</div></div></main><script>
const store=location.hostname.split('.')[0],key=`dukkani-customer-v2-${store}`;localStorage.removeItem(`dukkani-customer-${store}`);let customer=null;try{customer=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}if(!customer||!customer.loggedIn||!customer.email){location.replace('/customer-login')}else{document.getElementById('email').textContent=customer.email;loadOrders()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function loadOrders(){const box=document.getElementById('orders');try{const response=await fetch(`/shop/customer-orders?store=${encodeURIComponent(store)}&email=${encodeURIComponent(customer.email)}`,{cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.detail||'تعذّر تحميل الطلبات');const rows=data.orders||[];if(!rows.length){box.innerHTML='<div class="empty">لا توجد طلبات مسجلة بهذا الحساب حتى الآن.</div>';return}box.innerHTML=rows.map(row=>`<article class="order"><div><div class="order-name">${esc(row.order)}</div><div class="meta">${esc(row.date)} · ${Number(row.total||0).toLocaleString('ar-EG')} ${esc(row.currency||'')}</div></div><div class="status">${esc(row.status_label||row.status)}</div></article>`).join('')}catch(error){box.innerHTML=`<div class="error">${esc(error.message)}</div>`}}
</script></body></html>
