<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تتبع طلبك</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:#faf7ff;color:#24123a;font-family:Tajawal,Arial,sans-serif;min-height:100vh}.nav{height:76px;padding:0 6%;background:#fff;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee}.nav a{color:#7c3aed;text-decoration:none;font-weight:700}.brand{font-size:21px;font-weight:800}.wrap{width:min(720px,92%);margin:55px auto}.card{background:#fff;border:1px solid #e8e1f0;border-radius:24px;padding:32px;box-shadow:0 18px 60px #4c1d9510}h1{margin:0 0 8px;font-size:34px}.lead{color:#6b7280;margin:0 0 28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:700;margin-bottom:7px}input{width:100%;border:1px solid #d8d1df;border-radius:12px;padding:13px 14px;font:inherit;direction:ltr;text-align:right}button{width:100%;margin-top:18px;border:0;border-radius:12px;padding:14px;background:#7c3aed;color:#fff;font:800 16px Tajawal;cursor:pointer}button:disabled{opacity:.6}.msg{min-height:24px;margin-top:14px;color:#b91c1c}.result{display:none;margin-top:28px;border-top:1px solid #eee;padding-top:25px}.summary{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.status{color:#7c3aed;font-size:22px;font-weight:800}.steps{display:grid;grid-template-columns:repeat(4,1fr);margin-top:30px;position:relative}.steps:before{content:"";position:absolute;right:8%;left:8%;top:14px;height:3px;background:#e5e7eb}.step{position:relative;text-align:center;color:#9ca3af;font-size:13px}.dot{display:block;width:30px;height:30px;border-radius:50%;background:#e5e7eb;margin:0 auto 8px;border:5px solid #fff;box-shadow:0 0 0 1px #ddd}.step.done{color:#24123a;font-weight:700}.step.done .dot{background:#7c3aed}.cancelled{margin-top:25px;padding:14px;border-radius:12px;background:#fee2e2;color:#991b1b;font-weight:800;text-align:center}@media(max-width:600px){.wrap{margin:28px auto}.card{padding:22px}.grid{grid-template-columns:1fr}h1{font-size:28px}.steps{grid-template-columns:1fr;gap:12px}.steps:before{display:none}.step{display:flex;align-items:center;gap:10px;text-align:right}.dot{margin:0}}
</style></head><body>
<nav class="nav"><div class="brand">دكاني</div><a href="/">العودة للمتجر</a></nav><main class="wrap"><section class="card">
<h1>تتبّع طلبك</h1><p class="lead">أدخل رقم الطلب والبريد الإلكتروني المستخدم عند الشراء.</p>
<form id="form"><div class="grid"><div><label for="order">رقم الطلب</label><input id="order" required placeholder="DKN-ORD-2026-00001"></div><div><label for="email">البريد الإلكتروني</label><input id="email" type="email" required placeholder="name@example.com"></div></div><button id="submit">عرض حالة الطلب</button><div class="msg" id="msg"></div></form>
<div class="result" id="result"><div class="summary"><div><small>رقم الطلب</small><div id="number"></div></div><div><small>الحالة الحالية</small><div class="status" id="status"></div></div><div><small>الإجمالي</small><div id="total"></div></div></div><div id="progress" class="steps"></div></div>
</section></main><script>
const store=location.hostname.split('.')[0],form=document.getElementById('form'),msg=document.getElementById('msg'),result=document.getElementById('result'),button=document.getElementById('submit'),labels=['تم استلام الطلب','تم تأكيد الطلب','خرج للتوصيل','تم التسليم'];
form.onsubmit=async e=>{e.preventDefault();msg.textContent='';result.style.display='none';button.disabled=true;button.textContent='جاري البحث…';try{const order=document.getElementById('order').value.trim(),email=document.getElementById('email').value.trim(),response=await fetch(`/shop/order-status?store=${encodeURIComponent(store)}&order=${encodeURIComponent(order)}&email=${encodeURIComponent(email)}`),data=await response.json();if(!response.ok)throw new Error(data.detail||'تعذر البحث عن الطلب');document.getElementById('number').textContent=data.order;document.getElementById('status').textContent=data.status_label;document.getElementById('total').textContent=`${Number(data.total).toLocaleString('ar-EG')} ${data.currency}`;const progress=document.getElementById('progress');progress.className=data.cancelled?'cancelled':'steps';progress.innerHTML=data.cancelled?data.status_label:labels.map((label,i)=>`<div class="step ${i<data.step?'done':''}"><span class="dot"></span>${label}</div>`).join('');result.style.display='block'}catch(error){msg.textContent=error.message}finally{button.disabled=false;button.textContent='عرض حالة الطلب'}};
</script></body></html>
