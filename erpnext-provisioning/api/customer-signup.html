<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>إنشاء حساب عميل</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f4f6;color:#111827;font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif}
    header{height:70px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center}
    .head{width:min(1100px,calc(100% - 40px));margin:auto;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:10px;color:#111827;text-decoration:none;font-weight:800}.logo{width:38px;height:38px;border-radius:11px;background:#7c3aed;color:#fff;display:grid;place-items:center}
    .back{color:#6b7280;text-decoration:none;font-size:14px;font-weight:700}.main{width:min(480px,calc(100% - 32px));margin:40px auto}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:32px}
    h1{font-size:23px;text-align:center;margin:0 0 8px}.sub{text-align:center;color:#6b7280;font-size:14px;margin:0 0 25px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:16px}
    label{display:block;font-size:13px;font-weight:700;color:#374151;margin-bottom:6px}.req{color:#ef4444}.input{width:100%;height:46px;padding:0 13px;border:1px solid #d1d5db;border-radius:10px;font:inherit;background:#fff}.input:focus{outline:0;border-color:#7c3aed;box-shadow:0 0 0 3px #7c3aed20}.password-wrap{position:relative}.password-wrap .input{padding-left:48px}.password-eye{position:absolute;left:5px;top:5px;width:38px;height:36px;border:0;border-radius:8px;background:transparent;color:#6b7280;display:grid;place-items:center;cursor:pointer;padding:0}.password-eye:hover{background:#f3f4f6}.password-eye svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8}
    button{width:100%;height:48px;border:0;border-radius:12px;background:#7c3aed;color:#fff;font:800 15px inherit;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.msg{display:none;margin-bottom:16px;padding:11px 13px;border-radius:10px;font-size:13px;font-weight:700}.msg.err{display:block;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}.msg.ok{display:block;background:#ecfdf5;border:1px solid #a7f3d0;color:#047857}
    .login{text-align:center;margin-top:20px;color:#6b7280;font-size:14px}.login a{color:#7c3aed;font-weight:800;text-decoration:none}.foot{text-align:center;color:#9ca3af;font-size:12px;margin-top:24px}
    @media(max-width:520px){.main{margin:22px auto}.card{padding:24px 18px}.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><div class="head"><a class="brand" href="/"><span class="logo">د</span><span id="store-name">المتجر</span></a><a class="back" href="/">العودة للمتجر ←</a></div></header>
  <main class="main"><section class="card">
    <h1>إنشاء حساب عميل جديد</h1><p class="sub">سجّل بياناتك، ثم استخدم حسابك لتسجيل الدخول والشراء</p>
    <div id="msg" class="msg" role="alert"></div>
    <form id="customer-signup" novalidate>
      <div class="row">
        <div class="field"><label for="first_name">الاسم الأول <span class="req">*</span></label><input class="input" id="first_name" autocomplete="given-name" required></div>
        <div class="field"><label for="last_name">اسم العائلة <span class="req">*</span></label><input class="input" id="last_name" autocomplete="family-name" required></div>
      </div>
      <div class="field"><label for="email">البريد الإلكتروني <span class="req">*</span></label><input class="input" id="email" type="email" dir="ltr" autocomplete="email" required></div>
      <div class="field"><label for="phone">رقم الجوال <span class="req">*</span></label><input class="input" id="phone" type="tel" dir="ltr" autocomplete="tel" required></div>
      <div class="field"><label for="password">كلمة المرور <span class="req">*</span></label><div class="password-wrap"><input class="input" id="password" type="password" minlength="8" autocomplete="new-password" required><button class="password-eye" type="button" data-password="password" aria-label="إظهار كلمة المرور"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
      <div class="field"><label for="password_confirmation">تأكيد كلمة المرور <span class="req">*</span></label><div class="password-wrap"><input class="input" id="password_confirmation" type="password" minlength="8" autocomplete="new-password" required><button class="password-eye" type="button" data-password="password_confirmation" aria-label="إظهار كلمة المرور"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
      <button id="submit" type="submit">إنشاء حساب</button>
    </form>
    <div class="login">لديك حساب بالفعل؟ <a href="/customer-login">تسجيل الدخول</a></div>
  </section><div class="foot">مدعوم بواسطة دكاني</div></main>
  <script>
    const store = location.hostname.split(".")[0];
    document.getElementById("store-name").textContent = store;
    const form = document.getElementById("customer-signup"), msg = document.getElementById("msg"), submit = document.getElementById("submit");
    const show = (kind, text) => { msg.className = "msg " + kind; msg.textContent = text; };
    document.querySelectorAll(".password-eye").forEach(button => button.addEventListener("click", () => {
      const input = document.getElementById(button.dataset.password), visible = input.type === "text";
      input.type = visible ? "password" : "text";
      button.setAttribute("aria-label", visible ? "إظهار كلمة المرور" : "إخفاء كلمة المرور");
    }));
    form.addEventListener("submit", async event => {
      event.preventDefault();
      const data = Object.fromEntries(["first_name","last_name","email","phone","password","password_confirmation"].map(id => [id, document.getElementById(id).value.trim()]));
      if (!data.first_name || !data.last_name || !data.email || !data.phone) return show("err", "من فضلك أكمل كل البيانات المطلوبة.");
      if (data.password.length < 8) return show("err", "كلمة المرور يجب أن تكون 8 أحرف على الأقل.");
      if (data.password !== data.password_confirmation) return show("err", "كلمتا المرور غير متطابقتين.");
      submit.disabled = true; submit.textContent = "جاري إنشاء الحساب…";
      try {
        const response = await fetch(`/shop/customer-register?store=${encodeURIComponent(store)}`, {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || "تعذّر إنشاء الحساب.");
        show("ok", result.email_sent ? "تم إنشاء حسابك وإرسال رسالة إلى بريدك. جاري تحويلك لتسجيل الدخول…" : "تم إنشاء حسابك بنجاح. جاري تحويلك لتسجيل الدخول…");
        setTimeout(() => location.replace("/customer-login"), 1200);
      } catch (error) { show("err", error.message); submit.disabled = false; submit.textContent = "إنشاء حساب"; }
    });
  </script>
</body>
</html>
