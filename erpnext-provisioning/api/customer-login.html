<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تسجيل دخول العميل</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f4f6;color:#111827;font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif}header{height:70px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center}.head{width:min(1100px,calc(100% - 40px));margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;color:#111827;text-decoration:none;font-weight:800}.logo{width:38px;height:38px;border-radius:11px;background:#7c3aed;color:#fff;display:grid;place-items:center}.back{color:#6b7280;text-decoration:none;font-size:14px;font-weight:700}.main{width:min(480px,calc(100% - 32px));margin:55px auto}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:32px}h1{font-size:23px;text-align:center;margin:0 0 8px}.sub{text-align:center;color:#6b7280;font-size:14px;margin:0 0 25px}.field{margin-bottom:16px}label{display:block;font-size:13px;font-weight:700;color:#374151;margin-bottom:6px}.input{width:100%;height:46px;padding:0 13px;border:1px solid #d1d5db;border-radius:10px;font:inherit;background:#fff}.input:focus{outline:0;border-color:#7c3aed;box-shadow:0 0 0 3px #7c3aed20}.password-wrap{position:relative}.password-wrap .input{padding-left:48px}.password-eye{position:absolute;left:5px;top:5px;width:38px;height:36px;border:0;border-radius:8px;background:transparent;color:#6b7280;display:grid;place-items:center;cursor:pointer;padding:0}.password-eye svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8}button.submit{width:100%;height:48px;border:0;border-radius:12px;background:#7c3aed;color:#fff;font:800 15px inherit;cursor:pointer}.submit:disabled{opacity:.65}.msg{display:none;margin-bottom:16px;padding:11px 13px;border-radius:10px;font-size:13px;font-weight:700}.msg.err{display:block;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}.signup{text-align:center;margin-top:20px;color:#6b7280;font-size:14px}.signup a{color:#7c3aed;font-weight:800;text-decoration:none}.foot{text-align:center;color:#9ca3af;font-size:12px;margin-top:24px}@media(max-width:520px){.main{margin:24px auto}.card{padding:24px 18px}}
  </style>
</head>
<body>
  <header><div class="head"><a class="brand" href="/"><span class="logo">د</span><span id="store-name">المتجر</span></a><a class="back" href="/">العودة للمتجر ←</a></div></header>
  <main class="main"><section class="card"><h1>تسجيل دخول العميل</h1><p class="sub">ادخل إلى حسابك لمتابعة التسوق والطلبات</p><div id="msg" class="msg"></div>
    <form id="customer-login"><div class="field"><label for="email">البريد الإلكتروني</label><input class="input" id="email" type="email" dir="ltr" autocomplete="email" required></div><div class="field"><label for="password">كلمة المرور</label><div class="password-wrap"><input class="input" id="password" type="password" autocomplete="current-password" required><button class="password-eye" type="button" aria-label="إظهار كلمة المرور"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><button class="submit" id="submit" type="submit">تسجيل الدخول</button></form>
    <div class="signup">ليس لديك حساب؟ <a href="/customer-signup">إنشاء حساب عميل</a></div>
  </section><div class="foot">مدعوم بواسطة دكاني</div></main>
  <script>
    document.getElementById("store-name").textContent=location.hostname.split(".")[0];
    const pass=document.getElementById("password"),eye=document.querySelector(".password-eye");eye.onclick=()=>{const visible=pass.type==="text";pass.type=visible?"password":"text";eye.setAttribute("aria-label",visible?"إظهار كلمة المرور":"إخفاء كلمة المرور")};
    const form=document.getElementById("customer-login"),msg=document.getElementById("msg"),submit=document.getElementById("submit");
    form.addEventListener("submit",async event=>{event.preventDefault();event.stopImmediatePropagation();msg.className="msg";submit.disabled=true;submit.textContent="جاري تسجيل الدخول…";try{const store=location.hostname.split(".")[0],body={email:document.getElementById("email").value.trim(),password:pass.value};const response=await fetch(`/shop/customer-login?store=${encodeURIComponent(store)}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const result=await response.json();if(!response.ok||!result.authenticated)throw new Error(result.detail||"البريد الإلكتروني أو كلمة المرور غير صحيحة.");localStorage.removeItem(`dukkani-customer-${store}`);localStorage.setItem(`dukkani-customer-v2-${store}`,JSON.stringify({email:result.email,name:result.name,loggedIn:true}));const next=new URLSearchParams(location.search).get("next");location.replace(next==="checkout"?"/?resume=checkout":"/")}catch(error){msg.className="msg err";msg.textContent=error.message;submit.disabled=false;submit.textContent="تسجيل الدخول"}},true);
  </script>
</body></html>
